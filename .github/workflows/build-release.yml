name: Build and Release

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  release:
    types: [ published ]

jobs:
  lint:
    name: Lint PHP (${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php: [ '7.4', '8.0', '8.1', '8.2', '8.3' ]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}

      - name: Syntax check all PHP files
        run: |
          find . -name "*.php" -not -path "./vendor/*" -exec php -l {} +

  build:
    name: Package Plugin Archive
    needs: lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Prepare distribution package
        run: |
          mkdir -p dist/heretek-analytics
          rsync -av --exclude='.git*' \
                    --exclude='.github' \
                    --exclude='dist' \
                    --exclude='node_modules' \
                    --exclude='vendor' \
                    --exclude='*.zip' \
                    ./ dist/heretek-analytics/
          cd dist
          zip -r ../heretek-analytics.zip heretek-analytics/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: heretek-analytics-zip
          path: heretek-analytics.zip

      - name: Attach to Release
        if: github.event_name == 'release' || startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: heretek-analytics.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
